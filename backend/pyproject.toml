[project]
name = "graphene-backend"
version = "0.2.0"
description = "Local workspace for graphene microscopy screening"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "jsonschema>=4.23,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_local"]
addopts = "-ra"

[project.optional-dependencies]
models = ["graphene-model-contract[validation]"]

[tool.uv.sources]
graphene-model-contract = { path = "../packages/graphene-model-contract", editable = true }
